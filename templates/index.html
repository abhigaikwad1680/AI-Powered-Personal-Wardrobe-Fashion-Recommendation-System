<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VASTRAA – AI Outfit Recommender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C1233; --ink-2:#2E1F52; --paper:#F5F2FB; --card:#fff; --line:#E4DFF0;
  --saffron:#F5A524; --vermilion:#E2314D; --peacock:#12808F; --muted:#6B6485; --text:#241A3D;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5}
button,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--ink);color:var(--paper);padding:56px 24px 120px;
  border-radius:0 0 48px 48px;
  background-image:
    radial-gradient(600px 300px at 85% 10%,rgba(226,49,77,.38),transparent 70%),
    radial-gradient(500px 300px at 10% 110%,rgba(18,128,143,.45),transparent 70%),
    radial-gradient(400px 240px at 55% 0%,rgba(245,165,36,.22),transparent 70%)}
.hero::before{content:"";position:absolute;inset:0;opacity:.07;pointer-events:none;
  background-image:repeating-linear-gradient(45deg,#fff 0 1px,transparent 1px 7px),repeating-linear-gradient(-45deg,#fff 0 1px,transparent 1px 7px)}
.hero-in{position:relative;max-width:1040px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(52px,10vw,112px);line-height:.95;letter-spacing:-.02em}
.brand .sub{margin:14px 0 6px;font-family:var(--display);font-weight:600;font-size:18px;color:var(--saffron)}
.brand p{margin:0;max-width:34ch;color:#CFC6E6;font-size:18px}

.fan{display:flex;align-items:flex-end;padding:0 24px 0 0;margin-bottom:-6px}
.sw{position:relative;width:52px;height:168px;margin-left:-20px;border:0;border-radius:14px 14px 10px 10px;cursor:pointer;
  transform-origin:50% 100%;transform:rotate(var(--r));transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;
  box-shadow:0 10px 24px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.18)}
.sw::before{content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(100deg,rgba(255,255,255,.28),transparent 35%,rgba(0,0,0,.25))}
.sw::after{content:"";position:absolute;top:10px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--ink);opacity:.85}
.sw:hover,.sw:focus-visible{transform:rotate(var(--r)) translateY(-16px);z-index:5}
.sw.on{transform:rotate(var(--r)) translateY(-26px);box-shadow:0 0 0 3px var(--saffron),0 14px 28px rgba(0,0,0,.4);z-index:6}
.fan-cap{width:100%;text-align:right;font-size:13px;color:#B5AAD3;margin-top:14px;padding-right:24px}

/* ---------- layout ---------- */
main{max-width:1040px;margin:-84px auto 0;padding:0 20px 72px;position:relative}
.panel{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:0 24px 60px -24px rgba(28,18,51,.35)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.lbl{font-size:14px;font-weight:600;color:var(--muted);margin-right:4px;min-width:64px}
.seg{display:inline-flex;background:var(--paper);padding:4px;border-radius:999px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:9px 22px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
textarea{width:100%;min-height:104px;margin:18px 0 6px;padding:16px 18px;border:1.5px solid var(--line);border-radius:18px;resize:vertical;font-size:18px;background:#FCFBFF}
textarea:focus{border-color:var(--ink-2);outline:none;box-shadow:0 0 0 4px rgba(46,31,82,.12)}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14.5px;transition:border-color .2s,background .2s,transform .2s}
.chip:hover{border-color:var(--ink-2);background:var(--paper)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.group{margin-top:16px}
.status{font-size:14px;color:var(--peacock);font-weight:500}
.go{margin-top:22px;width:100%;border:0;border-radius:16px;padding:16px;font-family:var(--display);font-weight:800;font-size:19px;color:#fff;cursor:pointer;
  background:linear-gradient(100deg,var(--vermilion),#F0554A 55%,var(--saffron));box-shadow:0 14px 28px -10px rgba(226,49,77,.7);transition:transform .15s,filter .2s}
.go:hover{filter:brightness(1.06)}.go:active{transform:translateY(1px)}
.go[disabled]{filter:grayscale(.4);cursor:wait}
.err{margin-top:14px;padding:12px 16px;border-radius:12px;background:#FFE9EC;color:#9C1B31;font-weight:500}

/* ---------- results ---------- */
.res-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:44px 0 18px}
.res-head h2{margin:0;font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:-.01em}
.res-head span{color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 40px -26px rgba(28,18,51,.5)}
.stage{position:relative;aspect-ratio:240/340;overflow:hidden;
  background:radial-gradient(circle at 50% 38%,var(--tint) 0,transparent 68%),linear-gradient(180deg,#F7F4FD,#ECE7F7)}
.stage::before{content:"";position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,.55) 14px 15px)}
.stage svg.fit{position:absolute;left:0;right:0;top:4%;height:94%;width:100%;overflow:visible}
.hang{transform-origin:120px 22px}
.badge{position:absolute;top:14px;left:14px;padding:6px 12px;border-radius:999px;background:var(--saffron);color:var(--ink);font-weight:700;font-size:13px;z-index:2}
.dots{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:6px;z-index:2}
.dots i{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:14px;flex:1}
.title{display:flex;justify-content:space-between;align-items:center;gap:12px}
.title h3{margin:0;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.15}
.ring{position:relative;width:58px;height:58px;flex:none}
.ring svg{width:58px;height:58px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:15px}
.items{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.items li{display:flex;gap:12px;align-items:center;font-size:15.5px;line-height:1.3}
.items svg{width:30px;height:30px;flex:none;padding:4px;background:var(--paper);border-radius:10px}
.items small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.why{margin:auto 0 0;padding-top:12px;border-top:1px dashed var(--line);color:var(--muted);font-size:14px}

/* ---------- empty + loading ---------- */
.empty{margin-top:44px;text-align:center;color:var(--muted)}
.empty svg{width:min(420px,90%);height:auto}
.skel .stage,.skel .l{background:linear-gradient(100deg,#EEE9F8 30%,#F9F7FD 50%,#EEE9F8 70%);background-size:300% 100%;animation:sh 1.3s linear infinite}
.skel .stage::before{display:none}
.skel .l{height:16px;border-radius:8px;margin:6px 0}
@keyframes sh{to{background-position:-300% 0}}

/* one orchestrated reveal when results arrive */
.reveal .card{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*130ms)}
.reveal .hang{animation:sway 1.6s ease-out both;animation-delay:calc(var(--i)*130ms + 200ms)}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}}
@keyframes sway{0%{transform:rotate(-7deg)}30%{transform:rotate(5deg)}60%{transform:rotate(-2.5deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){.hero{padding:40px 20px 110px;border-radius:0 0 32px 32px}.sw{width:40px;height:130px;margin-left:-14px}.fan-cap{text-align:left;padding:0}.fan{padding:0}.panel{padding:18px}}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-in">
    <div class="brand">
      <h1>VASTRAA</h1>
      <div class="sub">AI wardrobe &amp; fashion recommender</div>
      <p>Describe the occasion and the look you want. We lay out three complete outfits.</p>
    </div>
    <div class="fan" id="fan" role="group" aria-label="Colour swatches"></div>
    <div class="fan-cap" id="fanCap">Tap a swatch to add that colour to your look.</div>
  </div>
</header>

<main>
  <section class="panel">
    <div class="row">
      <span class="lbl">For</span>
      <div class="seg" id="gender">
        <button type="button" data-v="men" aria-pressed="true">Men</button>
        <button type="button" data-v="women" aria-pressed="false">Women</button>
      </div>
    </div>

    <textarea id="q" maxlength="300" placeholder="e.g. bold red striped look for a wedding"></textarea>

    <div class="row group" id="occ"><span class="lbl">Occasion</span></div>
    <div class="row group" id="tries"><span class="lbl">Try</span></div>
    <div class="row group" id="wx"><span class="lbl">Weather</span>
      <button type="button" class="chip" id="geo">📍 Use today's weather</button>
      <span class="status" id="wxStatus" aria-live="polite"></span>
    </div>

    <button class="go" id="go" type="button">Suggest outfits</button>
    <div class="err" id="err" role="alert" hidden></div>
  </section>

  <section id="out" aria-live="polite">
    <div class="empty" id="empty">
      <svg viewBox="0 0 420 150" aria-hidden="true">
        <g fill="none" stroke="#B9B0D3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M70 18v-8q0-8 9-8t9 8"/><path d="M70 18 30 40h80z" fill="#E4DFF0"/>
          <path d="M210 18v-8q0-8 9-8t9 8"/><path d="M210 18 170 40h80z" fill="#F7D9A8"/>
          <path d="M350 18v-8q0-8 9-8t9 8"/><path d="M350 18 310 40h80z" fill="#F6B9C4"/>
        </g>
        <path d="M30 40h80M170 40h80M310 40h80" stroke="#B9B0D3" stroke-width="2.5"/>
      </svg>
      <p>Your three outfits will hang here.</p>
    </div>
  </section>
</main>

<script>
const HEX={beige:"#D8C3A5",black:"#222226",blue:"#1E5FBF",brown:"#7B4B2A",burgundy:"#6D1A36",cream:"#EFE6D2",gold:"#D9A93B",green:"#2E8B57",grey:"#8A8A92",lavender:"#B7A6D9",maroon:"#7A1F2B",multicolor:"#D7263D",mustard:"#D4A017",navy:"#1F2A44",olive:"#6B7B3A",orange:"#E8742A",peach:"#F4B393",pink:"#E78FB3",purple:"#7B3FA0",red:"#C62828",silver:"#B8BCC4",teal:"#1F8A8A",turquoise:"#2CC4C4",white:"#F5F5F2",yellow:"#F2C230",charcoal:"#2E2E33",khaki:"#CBB994",denim:"#3C5A8A",ivory:"#F3EEDC",golden:"#D9A93B",tan:"#B8844B",steel:"#A9AFB8"};
const GOLD="#D9A93B", SKIN="#E3B58F";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- colour helpers ---------- */
const shade=(h,f)=>"#"+[1,3,5].map(i=>Math.min(255,Math.round(parseInt(h.substr(i,2),16)*f)).toString(16).padStart(2,"0")).join("");
function firstColour(text,fallback){
  for(const w of (text||"").toLowerCase().match(/[a-z]+/g)||[]) if(HEX[w]) return HEX[w];
  return fallback;
}

/* ---------- state ---------- */
let gender="men", weather="any";
const q=$("#q");

/* ---------- controls ---------- */
const FAN=["red","mustard","teal","navy","pink","olive","lavender","maroon"];
FAN.forEach((c,i)=>{
  const b=document.createElement("button");
  b.type="button"; b.className="sw"; b.dataset.c=c; b.setAttribute("aria-label","Add colour "+c);
  b.style.background=HEX[c]; b.style.setProperty("--r",((i-(FAN.length-1)/2)*7)+"deg");
  b.addEventListener("mouseenter",()=>$("#fanCap").textContent=c[0].toUpperCase()+c.slice(1));
  b.addEventListener("mouseleave",()=>$("#fanCap").textContent="Tap a swatch to add that colour to your look.");
  b.addEventListener("click",()=>{
    const re=new RegExp("\\b"+c+"\\b","i");
    if(re.test(q.value)){ q.value=q.value.replace(re,"").replace(/\s{2,}/g," ").trim(); b.classList.remove("on"); }
    else { q.value=(c+" "+q.value).trim(); b.classList.add("on"); }
    q.focus();
  });
  $("#fan").appendChild(b);
});

$("#gender").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  gender=b.dataset.v;
  document.querySelectorAll("#gender button").forEach(x=>x.setAttribute("aria-pressed",x===b));
});

const OCC=[["wedding","💍"],["festival","🪔"],["office","💼"],["interview","🤝"],["date","🌹"],["party","🎉"],["casual","☕"]];
OCC.forEach(([o,e])=>{
  const b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent=e+" "+o;
  b.addEventListener("click",()=>{ if(!new RegExp("\\b"+o+"\\b","i").test(q.value)) q.value=(q.value.trim()+" "+o).trim(); q.focus(); });
  $("#occ").appendChild(b);
});

["bold red striped look for a wedding","simple formal outfit for an interview","casual look, no black, for a rainy day"].forEach(t=>{
  const b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent=t;
  b.addEventListener("click",()=>{ q.value=t; document.querySelectorAll(".sw").forEach(s=>s.classList.remove("on")); });
  $("#tries").appendChild(b);
});

const WX=[["any","🌈 Any"],["summer","☀️ Summer"],["winter","❄️ Winter"],["rainy","🌧️ Rainy"],["all-season","🍃 All-season"]];
const wxBtns=WX.map(([v,t])=>{
  const b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent=t; b.dataset.v=v;
  b.setAttribute("aria-pressed",v==="any");
  b.addEventListener("click",()=>setWeather(v));
  $("#wx").insertBefore(b,$("#geo")); return b;
});
function setWeather(v){ weather=v; wxBtns.forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v)); }

$("#geo").addEventListener("click",()=>{
  const s=$("#wxStatus");
  if(!navigator.geolocation){ s.textContent="Location isn't available in this browser."; return; }
  s.textContent="Checking the sky…";
  navigator.geolocation.getCurrentPosition(async p=>{
    try{
      const u=`https://api.open-meteo.com/v1/forecast?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&current=temperature_2m,precipitation,weather_code`;
      const c=(await (await fetch(u)).json()).current;
      const code=c.weather_code, rain=c.precipitation>0||(code>=51&&code<=67)||(code>=80&&code<=82)||code>=95;
      const t=c.temperature_2m;
      const v=rain?"rainy":t>=28?"summer":t<=18?"winter":"all-season";
      setWeather(v); s.textContent=`${Math.round(t)}°C right now → ${v}`;
    }catch(e){ s.textContent="Couldn't fetch the weather. Pick one above."; }
  },()=>{ s.textContent="Location permission was denied. Pick a weather above."; },{timeout:8000});
});

/* ---------- fabric patterns ---------- */
function patternDef(id,name,m){
  const o=`fill="${m}"`;
  switch(name){
    case "Dotted": return `<pattern id="${id}" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.7" ${o} fill-opacity=".6"/></pattern>`;
    case "Striped": return `<pattern id="${id}" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="3.5" height="9" ${o} fill-opacity=".5"/></pattern>`;
    case "Checks": return `<pattern id="${id}" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="7" height="14" ${o} fill-opacity=".28"/><rect y="7" width="14" height="7" ${o} fill-opacity=".28"/></pattern>`;
    case "Polka": return `<pattern id="${id}" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="3" ${o} fill-opacity=".6"/><circle cx="13.5" cy="13.5" r="3" ${o} fill-opacity=".6"/></pattern>`;
    case "Floral": return `<pattern id="${id}" width="24" height="24" patternUnits="userSpaceOnUse"><g ${o} fill-opacity=".6"><circle cx="12" cy="8.4" r="2.4"/><circle cx="15.4" cy="10.9" r="2.4"/><circle cx="14.1" cy="14.9" r="2.4"/><circle cx="9.9" cy="14.9" r="2.4"/><circle cx="8.6" cy="10.9" r="2.4"/></g><circle cx="12" cy="12" r="1.5" fill="${GOLD}"/></pattern>`;
    default: return "";
  }
}

/* ---------- outfit drawing (240 x 380 canvas) ---------- */
function drawOutfit(r,g,n){
  const T=r.top_hex, M=r.mark_hex, B=r.bot_hex, pid="p"+n, sid="s"+n;
  const hasPat=r.pattern!=="Plain";
  const fab=(d,fill,pat)=>
    `<path d="${d}" fill="${fill}" stroke="${shade(fill,.6)}" stroke-width="1.2" stroke-linejoin="round"/>`+
    (pat&&hasPat?`<path d="${d}" fill="url(#${pid})"/>`:"")+`<path d="${d}" fill="url(#${sid})"/>`;
  const btn=(x,y,c=GOLD)=>`<circle cx="${x}" cy="${y}" r="2.4" fill="${c}" stroke="rgba(0,0,0,.35)" stroke-width=".6"/>`;
  const hanger=`<g class="hang"><path d="M120 50V38q0-16 14-16t14 12" fill="none" stroke="#8E8AA0" stroke-width="3" stroke-linecap="round"/><path d="M120 50 64 66h112z" fill="none" stroke="#8E8AA0" stroke-width="3" stroke-linejoin="round"/>`;
  const collar=(c)=>`<path d="M96 58 120 90 100 98 84 66Z M144 58 120 90 140 98 156 66Z" fill="${c}" stroke="${shade(c,.6)}" stroke-width="1.1" stroke-linejoin="round"/>`;
  const SH=`<path d="M84 62 52 80 38 190 56 196 70 120 72 228 168 228 170 120 184 196 202 190 188 80 156 62Q120 80 84 62Z"/>`;
  const shirtD="M84 62 52 80 38 190 56 196 70 120 72 228 168 228 170 120 184 196 202 190 188 80 156 62Q120 80 84 62Z";
  const pantsM="M72 224H168L174 374H126L120 276 114 374H66Z";
  const belt=`<rect x="72" y="224" width="96" height="9" fill="#222226"/><rect x="113" y="223" width="14" height="11" rx="2" fill="${GOLD}"/>`;
  const cuffs=(c)=>`<path d="M38 190 56 196 53 207 35 201Z M202 190 184 196 187 207 205 201Z" fill="${c}" stroke="${shade(c,.6)}" stroke-width="1"/>`;
  let type;
  if(g==="men") type={wedding:r.variant===0?"sherwani":"kurta",birthday:"blazer",professional:"shirtTie"}[r.cat]||"shirt";
  else type={wedding:"lehenga",professional:"blouse"}[r.cat]||"kurti";
  let s="";
  if(type==="shirt"||type==="shirtTie"){
    const tie=shade(T,.5)===T?"#333":(type==="shirtTie"?shade(T,.45):"");
    s=fab(pantsM,B)+belt+fab(shirtD,T,true)+collar(shade(T,1.12))+cuffs(M)+
      `<path d="M120 94V226" stroke="rgba(0,0,0,.25)" stroke-width="1.2"/>`+
      (type==="shirtTie"?`<path d="M113 90h14l-2 10h-10zM115 100h10l4 70-9 14-9-14z" fill="${tie}" stroke="${shade(tie,.6)}" stroke-width="1"/>`
        :`<path d="M90 130h24v24H90z" fill="none" stroke="rgba(0,0,0,.25)"/>`)+
      [112,142,172,202].filter(y=>type==="shirt"||y>190).map(y=>btn(120,y,"#fff")).join("");
  } else if(type==="blazer"){
    const d="M84 62 52 80 40 196 60 202 72 124 74 252 166 252 168 124 180 202 200 196 188 80 156 62Q120 80 84 62Z";
    s=fab("M72 246H168L174 374H126L120 292 114 374H66Z",B)+fab(d,T,true)+
      `<path d="M100 64h40L120 178Z" fill="#F2F0EA" stroke="rgba(0,0,0,.3)"/>`+
      `<path d="M94 62 120 178 100 190 74 100ZM146 62 120 178 140 190 166 100Z" fill="${shade(T,.86)}" stroke="${shade(T,.55)}" stroke-width="1.1" stroke-linejoin="round"/>`+
      `<path d="M138 132h16v8h-16z" fill="${GOLD}"/>`+btn(120,206,"#222");
  } else if(type==="kurta"||type==="sherwani"){
    const L=type==="sherwani"?292:266;
    const d=`M84 62 52 80 38 190 56 196 70 120 72 ${L} 168 ${L} 170 120 184 196 202 190 188 80 156 62Q120 80 84 62Z`;
    s=fab(`M82 ${L-8}H158L152 374H124L120 330 116 374H88Z`,B)+fab(d,T,true)+
      `<path d="M72 ${L-10}H168V${L}H72Z" fill="${GOLD}" opacity=".9"/>`+
      `<path d="M102 62Q120 78 138 62L140 72Q120 90 100 72Z" fill="${shade(T,.8)}" stroke="${GOLD}" stroke-width="1.4"/>`+
      (type==="sherwani"?`<rect x="113" y="76" width="14" height="${L-86}" fill="${GOLD}" opacity=".85"/>`+[92,118,144,170,196,222,248].map(y=>btn(120,y,"#8A5A12")).join("")+
        `<path d="M38 190 56 196 53 207 35 201Z M202 190 184 196 187 207 205 201Z" fill="${GOLD}"/>`
        :`<path d="M120 76V170" stroke="rgba(0,0,0,.28)" stroke-width="1.2"/>`+[104,128,152].map(y=>btn(120,y)).join(""));
  } else if(type==="blouse"){
    const d="M88 62 60 80 48 190 64 194 78 120 86 226 154 226 162 120 176 194 192 190 180 80 152 62Q120 80 88 62Z";
    s=fab("M84 222H156L182 374H128L120 282 112 374H58Z",B)+`<rect x="84" y="222" width="72" height="7" fill="#222226"/>`+
      fab(d,T,true)+`<path d="M104 62h32l-16 38z" fill="${SKIN}" stroke="rgba(0,0,0,.25)"/>`+
      `<path d="M104 62 120 100 136 62" fill="none" stroke="${shade(T,1.2)}" stroke-width="2.5"/>`+
      `<path d="M120 104v120" stroke="rgba(0,0,0,.2)"/>`+btn(120,150,"#fff")+btn(120,184,"#fff");
  } else if(type==="kurti"){
    const d="M88 62 60 80 50 160 66 164 80 118 70 262 170 262 160 118 174 164 190 160 180 80 152 62Q120 84 88 62Z";
    s=fab("M78 256H162L196 374H128L120 300 112 374H44Z",B)+fab(d,T,true)+
      `<path d="M106 62h28l-14 36z" fill="${SKIN}" stroke="rgba(0,0,0,.25)"/><path d="M106 62 120 98 134 62" fill="none" stroke="${GOLD}" stroke-width="2.4"/>`+
      `<path d="M70 250H170V262H70Z" fill="${GOLD}" opacity=".85"/>`+
      fab("M146 64C176 120 170 200 184 272L168 274C156 210 156 130 134 72Z",shade(B,1.3));
  } else { /* lehenga */
    s=`<rect x="92" y="130" width="56" height="30" fill="${SKIN}"/>`+
      fab("M88 150H152L216 374H24Z",B)+
      `<g stroke="rgba(0,0,0,.14)" fill="none"><path d="M110 156 78 374M120 156V374M130 156 162 374"/></g>`+
      `<path d="M36 346H204L216 374H24Z" fill="${GOLD}"/><path d="M36 346H204" stroke="rgba(0,0,0,.3)"/>`+
      `<rect x="88" y="150" width="64" height="8" fill="${GOLD}"/>`+
      fab("M92 62 66 78 60 120 76 124 88 100 90 138 150 138 152 100 164 124 180 120 174 78 148 62Q120 82 92 62Z",T,true)+
      `<path d="M104 62 120 98 136 62" fill="none" stroke="${GOLD}" stroke-width="2.4"/>`+
      fab("M96 64C58 124 58 230 74 340L92 340C80 236 90 132 116 76Z",shade(T,1.15),true)+
      `<path d="M74 340 92 340" stroke="${GOLD}" stroke-width="4"/>`;
  }
  return `<svg class="fit" viewBox="0 0 240 380" role="img" aria-label="${esc(r.label)}">
    <defs>${patternDef(pid,r.pattern,M)}
      <linearGradient id="${sid}" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".3" stop-color="#fff" stop-opacity=".14"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>
      <filter id="d${n}" x="-20%" y="-10%" width="140%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#1C1233" flood-opacity=".28"/></filter></defs>
    <g filter="url(#d${n})">${hanger}</g>${s}</g></svg>`;
}

/* ---------- small icons ---------- */
const ico={
  top:c=>`<svg viewBox="0 0 24 24"><path d="M8 3 2 7l2 5 3-1.5V21h10V10.5L20 12l2-5-6-4q-4 3-8 0Z" fill="${c}" stroke="rgba(0,0,0,.4)" stroke-linejoin="round"/></svg>`,
  bottom:c=>`<svg viewBox="0 0 24 24"><path d="M7 3h10l1 18h-5l-1-10-1 10H6Z" fill="${c}" stroke="rgba(0,0,0,.4)" stroke-linejoin="round"/></svg>`,
  shoes:c=>`<svg viewBox="0 0 24 24"><path d="M2 16v-5q0-1 2-1l4-1q3 3 7 3l5 2q2 1 2 3v2H2Z" fill="${c}" stroke="rgba(0,0,0,.4)" stroke-linejoin="round"/><path d="M2 19h20" stroke="#fff" stroke-opacity=".7" stroke-width="1.5"/></svg>`,
  watch:c=>`<svg viewBox="0 0 24 24"><rect x="9" y="1.5" width="6" height="21" rx="2" fill="${c}" stroke="rgba(0,0,0,.4)"/><circle cx="12" cy="12" r="6" fill="#fff" stroke="${shade(c,.6)}" stroke-width="2"/><path d="M12 8.5V12l2.5 1.5" stroke="#222" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>`
};

/* ---------- render results ---------- */
function card(r,i){
  const C=2*Math.PI*24, off=C*(1-r.match/100);
  const title=r.label.charAt(0).toUpperCase()+r.label.slice(1);
  return `<article class="card" style="--i:${i}">
    <div class="stage" style="--tint:${r.top_hex}33">
      ${i===0?'<span class="badge">Best match</span>':""}
      <div class="dots" aria-hidden="true"><i style="background:${r.top_hex}"></i><i style="background:${r.bot_hex}"></i></div>
      ${drawOutfit(r,gender,i)}
    </div>
    <div class="body">
      <div class="title"><h3>${esc(title)}</h3>
        <div class="ring" title="${r.match}% match"><svg viewBox="0 0 58 58"><defs><linearGradient id="rg${i}"><stop offset="0" stop-color="#F5A524"/><stop offset="1" stop-color="#E2314D"/></linearGradient></defs>
          <circle cx="29" cy="29" r="24" fill="none" stroke="#EEE9F8" stroke-width="6"/>
          <circle cx="29" cy="29" r="24" fill="none" stroke="url(#rg${i})" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><b>${r.match}%</b></div>
      </div>
      <ul class="items">
        <li>${ico.top(r.top_hex)}<span><small>Top</small>${esc(r.top)}</span></li>
        <li>${ico.bottom(r.bot_hex)}<span><small>Bottom</small>${esc(r.bottom)}</span></li>
        <li>${ico.shoes(firstColour(r.shoes,"#4A3B32"))}<span><small>Shoes</small>${esc(r.shoes)}</span></li>
        <li>${ico.watch(firstColour(r.watch,"#7B4B2A"))}<span><small>Watch</small>${esc(r.watch)}</span></li>
      </ul>
      <p class="why">${esc(r.why)}</p>
    </div></article>`;
}
const skeleton=()=>`<div class="grid skel">${[0,1,2].map(()=>`<div class="card"><div class="stage"></div><div class="body"><div class="l" style="width:70%"></div><div class="l"></div><div class="l" style="width:85%"></div></div></div>`).join("")}</div>`;

async function run(){
  const text=q.value.trim(), err=$("#err"), go=$("#go"), out=$("#out");
  err.hidden=true;
  if(!text){ err.textContent="Please describe the occasion and the look you want."; err.hidden=false; q.focus(); return; }
  go.disabled=true; go.textContent="Styling your looks…";
  out.innerHTML=`<div class="res-head"><h2>Picking outfits…</h2></div>`+skeleton();
  try{
    const res=await fetch("/api/recommend",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:text,gender,weather})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||"Something went wrong. Try again.");
    const meta=`${gender==="men"?"Men":"Women"}${weather!=="any"?" · "+weather:""}`;
    out.innerHTML=`<div class="res-head"><h2>Your three looks</h2><span>${esc(meta)}</span></div><div class="grid reveal">${data.results.map(card).join("")}</div>`;
    out.scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){
    out.innerHTML=""; err.textContent=e.message; err.hidden=false;
  }finally{ go.disabled=false; go.textContent="Suggest outfits"; }
}
$("#go").addEventListener("click",run);
q.addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)) run(); });
</script>
</body>
</html>
